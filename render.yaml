# Render Blueprint configuration for Singularity Player backend
services:
  - type: web
    name: singularity-player-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: server
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*" # Allow all origins by default (recommended for mobile/web accessibility)
