# Render Blueprint configuration for Singularity Player (Full-Stack Monorepo)
services:
  - type: web
    name: singularity-player
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PROXY_URL
        sync: false
      - key: PUBLIC_URL
        sync: false

