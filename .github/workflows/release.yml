name: Build and Publish Singularity Player Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate High-Resolution Icons
        run: node scripts/generateIcons.js

      - name: Build and Package Windows Executables
        run: npm run dist:win -- -c.publish=never

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Singularity Player ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist-electron/Singularity Player Setup *.exe
            dist-electron/Singularity Player *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
