<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singularity Player 2.0</title>
<style>
  /* ── Reset & Core ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08070d;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 32px 80px rgba(0, 0, 0, 0.95),
      0 0 60px rgba(139, 92, 246, 0.2),
      0 0 100px rgba(250, 45, 85, 0.12);
    -webkit-app-region: drag;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
  }

  /* ── Container ── */
  .splash {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    z-index: 1;
    padding: 36px;
  }

  /* ── Ambient Background Glows ── */
  .ambient {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    border-radius: 28px;
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(75px);
    opacity: 0;
    will-change: transform, opacity;
  }

  .orb-1 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.42) 0%, transparent 70%);
    top: 15%; left: 20%;
    animation: orb-drift-1 9s ease-in-out infinite, orb-appear 1.4s 0.2s ease-out forwards;
  }

  .orb-2 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, transparent 70%);
    bottom: 10%; right: 15%;
    animation: orb-drift-2 11s ease-in-out infinite, orb-appear 1.6s 0.4s ease-out forwards;
  }

  .orb-3 {
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(250, 45, 85, 0.25) 0%, transparent 70%);
    top: 50%; left: 50%;
    animation: orb-drift-3 13s ease-in-out infinite, orb-appear 1.8s 0.6s ease-out forwards;
  }

  @keyframes orb-appear {
    from { opacity: 0; transform: scale(0.6) translate3d(0, 0, 0); }
    to   { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
  }

  @keyframes orb-drift-1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    33%      { transform: translate3d(35px, -25px, 0) scale(1.08); }
    66%      { transform: translate3d(-20px, 20px, 0) scale(0.94); }
  }

  @keyframes orb-drift-2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    33%      { transform: translate3d(-30px, 25px, 0) scale(1.06); }
    66%      { transform: translate3d(25px, -15px, 0) scale(0.92); }
  }

  @keyframes orb-drift-3 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(20px, -30px, 0) scale(1.12); }
  }

  /* ── Particle Field ── */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: particle-float 7s ease-in-out infinite, particle-appear 1.2s ease-out forwards;
  }

  @keyframes particle-appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes particle-float {
    0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.3; }
    25%      { transform: translate3d(12px, -20px, 0); opacity: 0.75; }
    50%      { transform: translate3d(-8px, -40px, 0); opacity: 0.45; }
    75%      { transform: translate3d(16px, -28px, 0); opacity: 0.7; }
  }

  /* ── Logo & Emblem ── */
  .logo-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-glow {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.5) 0%, rgba(250, 45, 85, 0.2) 45%, transparent 70%);
    opacity: 0;
    animation: glow-pulse 3s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    filter: blur(28px);
  }

  @keyframes glow-pulse {
    0%   { opacity: 0; transform: scale(0.3); }
    50%  { opacity: 0.9; transform: scale(1.4); }
    100% { opacity: 0.55; transform: scale(1.05); }
  }

  .logo-svg {
    position: relative;
    width: 96px;
    height: 92px;
    opacity: 0;
    transform: scale(0.7) translate3d(0, 0, 0);
    animation: logo-enter 1.1s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.6)) drop-shadow(0 0 50px rgba(250, 45, 85, 0.3));
  }

  @keyframes logo-enter {
    0%   { opacity: 0; transform: scale(0.65) translate3d(0, 14px, 0); }
    60%  { opacity: 1; transform: scale(1.06) translate3d(0, -3px, 0); }
    100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
  }

  .bolt-outline {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw-bolt 1.4s 0.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }

  @keyframes draw-bolt {
    to { stroke-dashoffset: 0; }
  }

  .bolt-fill {
    opacity: 0;
    animation: fill-reveal 0.8s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fill-reveal {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .flash-ring {
    position: absolute;
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(139, 92, 246, 0.7);
    opacity: 0;
    animation: flash-expand 1.1s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes flash-expand {
    0%   { opacity: 0.9; transform: scale(0.4); border-width: 3px; }
    100% { opacity: 0; transform: scale(2.8); border-width: 0.5px; }
  }

  /* ── Title: "SINGULARITY" ── */
  .title {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 3px;
    margin-bottom: 8px;
  }

  .title-letter {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 0.16em;
    color: #ffffff;
    opacity: 0;
    transform: translate3d(0, 20px, 0);
    animation: letter-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  }

  @keyframes letter-up {
    to {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
  }

  /* Staggered letter delays */
  .title-letter:nth-child(1)  { animation-delay: 1.70s; }
  .title-letter:nth-child(2)  { animation-delay: 1.75s; }
  .title-letter:nth-child(3)  { animation-delay: 1.80s; }
  .title-letter:nth-child(4)  { animation-delay: 1.85s; }
  .title-letter:nth-child(5)  { animation-delay: 1.90s; }
  .title-letter:nth-child(6)  { animation-delay: 1.95s; }
  .title-letter:nth-child(7)  { animation-delay: 2.00s; }
  .title-letter:nth-child(8)  { animation-delay: 2.05s; }
  .title-letter:nth-child(9)  { animation-delay: 2.10s; }
  .title-letter:nth-child(10) { animation-delay: 2.15s; }
  .title-letter:nth-child(11) { animation-delay: 2.20s; }

  /* ── Subtitle: "NEXT-GEN AUDIO ENGINE • 2.0" ── */
  .subtitle {
    position: relative;
    z-index: 2;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.36em;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    opacity: 0;
    transform: translate3d(0, 10px, 0);
    animation: subtitle-in 0.7s 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    margin-bottom: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .subtitle-badge {
    background: linear-gradient(135deg, #fa2d55, #8b5cf6);
    color: #ffffff;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.1em;
  }

  @keyframes subtitle-in {
    to { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  /* ── Status Dispatcher ── */
  .status-text {
    position: relative;
    z-index: 2;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    margin-bottom: 12px;
    height: 14px;
    opacity: 0;
    animation: status-appear 0.5s 2.6s ease-out forwards;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  @keyframes status-appear {
    to { opacity: 1; }
  }

  /* ── Progress Bar ── */
  .loader-track {
    position: relative;
    z-index: 2;
    width: 240px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    animation: loader-appear 0.5s 2.6s ease-out forwards;
  }

  @keyframes loader-appear {
    to { opacity: 1; }
  }

  .loader-fill {
    position: absolute;
    top: 0; left: 0;
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #fa2d55, #8b5cf6, #06b6d4, transparent);
    border-radius: 4px;
    animation: loader-slide 1.5s 2.7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes loader-slide {
    0%   { transform: translateX(-130%); }
    100% { transform: translateX(340%); }
  }

  /* ── Version Tag ── */
  .version {
    position: absolute;
    bottom: 22px;
    z-index: 2;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 0.6s 2.9s ease-out forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  /* ── Exit Animation ── */
  .splash.exit {
    animation: splash-exit 0.65s cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  @keyframes splash-exit {
    0%   { opacity: 1; transform: scale(1); filter: blur(0px); }
    100% { opacity: 0; transform: scale(1.05); filter: blur(6px); }
  }

  /* ── Grain Texture Overlay ── */
  .grain-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: overlay;
    border-radius: 28px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }

  /* ── Vignette ── */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    border-radius: 28px;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
  }

  /* ── Horizontal Light Streak ── */
  .light-streak {
    position: absolute;
    top: 45%;
    left: -100%;
    width: 200%;
    height: 1.5px;
    z-index: 3;
    background: linear-gradient(90deg,
      transparent 0%,
      transparent 30%,
      rgba(250, 45, 85, 0.3) 42%,
      rgba(139, 92, 246, 0.7) 48%,
      rgba(255, 255, 255, 0.95) 50%,
      rgba(6, 182, 212, 0.7) 52%,
      rgba(6, 182, 212, 0.3) 58%,
      transparent 70%,
      transparent 100%
    );
    opacity: 0;
    animation: streak-flash 1.4s 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    filter: blur(0.5px);
  }

  @keyframes streak-flash {
    0%   { opacity: 0; transform: translateX(-30%) translateY(-50%) scaleY(1); }
    20%  { opacity: 1; transform: translateX(-10%) translateY(-50%) scaleY(3.5); }
    50%  { opacity: 0.7; transform: translateX(10%) translateY(-50%) scaleY(1.2); }
    100% { opacity: 0; transform: translateX(30%) translateY(-50%) scaleY(0.4); }
  }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <!-- Ambient Background Halo Canvas -->
    <div class="ambient">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Floating Starfield Particles -->
    <div class="particles" id="particles"></div>

    <!-- Radiant Light Streak -->
    <div class="light-streak"></div>

    <!-- Master Emblem -->
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="flash-ring"></div>
      <svg class="logo-svg" viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Stroke-draw outline -->
        <path class="bolt-outline"
          d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          stroke="url(#grad-stroke)" stroke-width="1.2" fill="none" />
        <!-- Fill reveal -->
        <path class="bolt-fill"
          d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          fill="url(#grad-fill)" />
        <defs>
          <linearGradient id="grad-stroke" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fa2d55" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <linearGradient id="grad-fill" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fa2d55" />
            <stop offset="45%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Title -->
    <div class="title">
      <span class="title-letter">S</span>
      <span class="title-letter">I</span>
      <span class="title-letter">N</span>
      <span class="title-letter">G</span>
      <span class="title-letter">U</span>
      <span class="title-letter">L</span>
      <span class="title-letter">A</span>
      <span class="title-letter">R</span>
      <span class="title-letter">I</span>
      <span class="title-letter">T</span>
      <span class="title-letter">Y</span>
    </div>

    <!-- Subtitle -->
    <div class="subtitle">
      <span>NEXT-GEN AUDIO ENGINE</span>
      <span class="subtitle-badge">2.0</span>
    </div>

    <!-- Live Status Indicator -->
    <div class="status-text" id="statusText">INITIALIZING ENGINE...</div>

    <!-- Loading Bar -->
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>

    <!-- Version -->
    <div class="version">Singularity Architecture • v2.0.1</div>

    <!-- Vignette & Grain -->
    <div class="vignette"></div>
    <div class="grain-overlay"></div>
  </div>

  <script>
    // Generate organic drifting particles
    (function() {
      const container = document.getElementById('particles');
      const count = 40;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 100) + '%';
        const size = (1.5 + Math.random() * 2.5);
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.animationDelay = (Math.random() * 4) + 's, ' + (0.2 + Math.random() * 1.5) + 's';
        p.style.animationDuration = (5 + Math.random() * 6) + 's, 1s';
        const rand = Math.random();
        if (rand > 0.66) {
          p.style.background = 'rgba(250, 45, 85, 0.6)';
        } else if (rand > 0.33) {
          p.style.background = 'rgba(139, 92, 246, 0.6)';
        } else {
          p.style.background = 'rgba(6, 182, 212, 0.5)';
        }
        container.appendChild(p);
      }
    })();

    // Dynamic boot phases for visual polish
    const phases = [
      'MOUNTING LOCAL AUDIO STACK...',
      'CALIBRATING 10-BAND DSP EQUALIZER...',
      'SYNCHRONIZING AUDIO DISPATCH BUS...',
      'STARTING SINGULARITY 2.0...'
    ];
    let phaseIdx = 0;
    const statusEl = document.getElementById('statusText');
    const statusInterval = setInterval(() => {
      phaseIdx = (phaseIdx + 1) % phases.length;
      if (statusEl) statusEl.textContent = phases[phaseIdx];
    }, 1100);

    // Listen for the close signal from Electron main process
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('splash:close', () => {
      clearInterval(statusInterval);
      if (statusEl) statusEl.textContent = 'READY';
      const splash = document.getElementById('splash');
      splash.classList.add('exit');
      // Wait for exit animation to complete before signaling back
      setTimeout(() => {
        ipcRenderer.send('splash:closed');
      }, 600);
    });
  </script>
</body>
</html>
