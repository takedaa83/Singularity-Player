<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singularity Player 2.0</title>
<style>
  /* ── Reset & Core ── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08070d;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow:
      0 32px 80px rgba(0, 0, 0, 0.95),
      0 0 60px rgba(139, 92, 246, 0.10),
      0 0 100px rgba(250, 45, 85, 0.06);
    -webkit-app-region: drag;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
  }

  /* ── Container ── */
  .splash {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    z-index: 1;
    padding: 36px;
    opacity: 0;
    animation: splash-fade-in 1.2s ease-out forwards;
  }

  @keyframes splash-fade-in {
    to { opacity: 1; }
  }

  /* ── Ambient Background Glows (softer, slower) ── */
  .ambient {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    border-radius: 28px;
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0;
    will-change: transform, opacity;
  }

  .orb-1 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.28) 0%, transparent 70%);
    top: 12%; left: 18%;
    animation:
      orb-drift-1 22s ease-in-out infinite,
      orb-appear 2.8s 0.3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .orb-2 {
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.20) 0%, transparent 70%);
    bottom: 8%; right: 12%;
    animation:
      orb-drift-2 26s ease-in-out infinite,
      orb-appear 3.0s 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .orb-3 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(250, 45, 85, 0.16) 0%, transparent 70%);
    top: 50%; left: 50%;
    animation:
      orb-drift-3 30s ease-in-out infinite,
      orb-appear 3.2s 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes orb-appear {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes orb-drift-1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(20px, -18px, 0) scale(1.04); }
  }

  @keyframes orb-drift-2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(-18px, 15px, 0) scale(1.03); }
  }

  @keyframes orb-drift-3 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(12px, -20px, 0) scale(1.06); }
  }

  /* ── Particle Field (fewer, dimmer, slower) ── */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation:
      particle-float 14s ease-in-out infinite,
      particle-appear 2.4s ease-out forwards;
  }

  @keyframes particle-appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes particle-float {
    0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.15; }
    50%      { transform: translate3d(6px, -22px, 0); opacity: 0.35; }
  }

  /* ── Logo & Emblem ── */
  .logo-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
  }

  .logo-glow {
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(139, 92, 246, 0.32) 0%,
      rgba(250, 45, 85, 0.10) 45%,
      transparent 70%);
    opacity: 0;
    animation: glow-pulse 4.5s 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    filter: blur(32px);
  }

  @keyframes glow-pulse {
    0%   { opacity: 0; transform: scale(0.7); }
    100% { opacity: 0.55; transform: scale(1); }
  }

  .logo-svg {
    position: relative;
    width: 96px;
    height: 92px;
    opacity: 0;
    transform: translate3d(0, 0, 0);
    animation: logo-enter 2.2s 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    filter:
      drop-shadow(0 0 20px rgba(139, 92, 246, 0.40))
      drop-shadow(0 0 40px rgba(250, 45, 85, 0.18));
  }

  @keyframes logo-enter {
    0%   { opacity: 0; transform: scale(0.94) translate3d(0, 8px, 0); }
    100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
  }

  .bolt-outline {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw-bolt 2.4s 0.9s cubic-bezier(0.5, 0, 0.25, 1) forwards;
  }

  @keyframes draw-bolt {
    to { stroke-dashoffset: 0; }
  }

  .bolt-fill {
    opacity: 0;
    animation: fill-reveal 1.8s 2.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes fill-reveal {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── Title: "SINGULARITY" ── */
  .title {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 3px;
    margin-bottom: 10px;
  }

  .title-letter {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #ffffff;
    opacity: 0;
    filter: blur(6px);
    transform: translate3d(0, 8px, 0);
    animation: letter-up 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }

  @keyframes letter-up {
    to {
      opacity: 1;
      filter: blur(0);
      transform: translate3d(0, 0, 0);
    }
  }

  /* Longer, gentler stagger */
  .title-letter:nth-child(1)  { animation-delay: 2.60s; }
  .title-letter:nth-child(2)  { animation-delay: 2.68s; }
  .title-letter:nth-child(3)  { animation-delay: 2.76s; }
  .title-letter:nth-child(4)  { animation-delay: 2.84s; }
  .title-letter:nth-child(5)  { animation-delay: 2.92s; }
  .title-letter:nth-child(6)  { animation-delay: 3.00s; }
  .title-letter:nth-child(7)  { animation-delay: 3.08s; }
  .title-letter:nth-child(8)  { animation-delay: 3.16s; }
  .title-letter:nth-child(9)  { animation-delay: 3.24s; }
  .title-letter:nth-child(10) { animation-delay: 3.32s; }
  .title-letter:nth-child(11) { animation-delay: 3.40s; }

  /* ── Subtitle ── */
  .subtitle {
    position: relative;
    z-index: 2;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.42em;
    color: rgba(255, 255, 255, 0.42);
    text-transform: uppercase;
    opacity: 0;
    transform: translate3d(0, 6px, 0);
    animation: subtitle-in 1.6s 3.9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    margin-bottom: 42px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subtitle-badge {
    background: linear-gradient(135deg, rgba(250, 45, 85, 0.85), rgba(139, 92, 246, 0.85));
    color: rgba(255, 255, 255, 0.95);
    font-size: 8.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.12em;
  }

  @keyframes subtitle-in {
    to { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  /* ── Status Dispatcher ── */
  .status-text {
    position: relative;
    z-index: 2;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: rgba(255, 255, 255, 0.32);
    text-transform: uppercase;
    margin-bottom: 14px;
    height: 14px;
    opacity: 0;
    animation: status-appear 1.2s 4.2s ease-out forwards;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    transition: opacity 0.6s ease;
  }

  @keyframes status-appear {
    to { opacity: 1; }
  }

  /* ── Progress Bar (single soft highlight, no rainbow) ── */
  .loader-track {
    position: relative;
    z-index: 2;
    width: 220px;
    height: 2px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    animation: loader-appear 1.2s 4.2s ease-out forwards;
  }

  @keyframes loader-appear {
    to { opacity: 1; }
  }

  .loader-fill {
    position: absolute;
    top: 0; left: 0;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.08) 20%,
      rgba(139, 92, 246, 0.85) 50%,
      rgba(255, 255, 255, 0.08) 80%,
      transparent 100%);
    border-radius: 4px;
    animation: loader-slide 2.6s 4.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes loader-slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(360%); }
  }

  /* ── Version Tag ── */
  .version {
    position: absolute;
    bottom: 24px;
    z-index: 2;
    font-size: 9.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.16);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 1.4s 4.6s ease-out forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  /* ── Exit Animation (slower, softer) ── */
  .splash.exit {
    animation: splash-exit 1.0s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes splash-exit {
    0%   { opacity: 1; transform: scale(1); filter: blur(0px); }
    100% { opacity: 0; transform: scale(1.02); filter: blur(8px); }
  }

  /* ── Grain Texture Overlay ── */
  .grain-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0.025;
    mix-blend-mode: overlay;
    border-radius: 28px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }

  /* ── Vignette ── */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    border-radius: 28px;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
  }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <!-- Ambient Background Halo Canvas -->
    <div class="ambient">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Floating Starfield Particles -->
    <div class="particles" id="particles"></div>

    <!-- Master Emblem -->
    <div class="logo-container">
      <div class="logo-glow"></div>
      <svg class="logo-svg" viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="bolt-outline"
          d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          stroke="url(#grad-stroke)" stroke-width="1" fill="none" />
        <path class="bolt-fill"
          d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          fill="url(#grad-fill)" />
        <defs>
          <linearGradient id="grad-stroke" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fa2d55" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <linearGradient id="grad-fill" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fa2d55" />
            <stop offset="45%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Title -->
    <div class="title">
      <span class="title-letter">S</span>
      <span class="title-letter">I</span>
      <span class="title-letter">N</span>
      <span class="title-letter">G</span>
      <span class="title-letter">U</span>
      <span class="title-letter">L</span>
      <span class="title-letter">A</span>
      <span class="title-letter">R</span>
      <span class="title-letter">I</span>
      <span class="title-letter">T</span>
      <span class="title-letter">Y</span>
    </div>

    <!-- Subtitle -->
    <div class="subtitle">
      <span>NEXT-GEN AUDIO ENGINE</span>
      <span class="subtitle-badge">2.0</span>
    </div>

    <!-- Live Status Indicator -->
    <div class="status-text" id="statusText">Initializing engine</div>

    <!-- Loading Bar -->
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>

    <!-- Version -->
    <div class="version">Singularity Architecture · v2.0.2</div>

    <!-- Vignette & Grain -->
    <div class="vignette"></div>
    <div class="grain-overlay"></div>
  </div>

  <script>
    // Fewer, softer particles
    (function() {
      const container = document.getElementById('particles');
      const count = 18;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 100) + '%';
        const size = (1 + Math.random() * 1.8);
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.animationDelay =
          (Math.random() * 8) + 's, ' +
          (0.5 + Math.random() * 2.5) + 's';
        p.style.animationDuration =
          (12 + Math.random() * 8) + 's, 2.4s';
        const rand = Math.random();
        if (rand > 0.66) {
          p.style.background = 'rgba(250, 45, 85, 0.35)';
        } else if (rand > 0.33) {
          p.style.background = 'rgba(139, 92, 246, 0.40)';
        } else {
          p.style.background = 'rgba(6, 182, 212, 0.30)';
        }
        container.appendChild(p);
      }
    })();

    // Slower, calmer status phases with soft crossfade
    const phases = [
      'Initializing engine',
      'Mounting local audio stack',
      'Calibrating DSP equalizer',
      'Synchronizing audio bus',
      'Preparing interface'
    ];
    let phaseIdx = 0;
    const statusEl = document.getElementById('statusText');

    function swapStatus(text) {
      if (!statusEl) return;
      statusEl.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = text;
        statusEl.style.opacity = '';
      }, 400);
    }

    const statusInterval = setInterval(() => {
      phaseIdx = (phaseIdx + 1) % phases.length;
      swapStatus(phases[phaseIdx]);
    }, 2200);

    // IPC bridge to main process
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('splash:close', () => {
      clearInterval(statusInterval);
      swapStatus('Ready');
      setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.classList.add('exit');
        setTimeout(() => {
          ipcRenderer.send('splash:closed');
        }, 1000);
      }, 300);
    });
  </script>
</body>
</html>
